[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curadoria-mri"
version = "0.2.0"
description = "Auditoria e curadoria de duplicatas para o TCC de classificação de tumores cerebrais em MRI."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
